<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>按鈕競速</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
#app{width:100%;max-width:520px}
h1{font-size:22px;font-weight:600;text-align:center;margin-bottom:2rem;color:#1a1a1a;letter-spacing:-0.02em}
.card{background:#fff;border:1px solid #e5e3de;border-radius:16px;padding:1.5rem;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:#888;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none;background:#fafaf8;transition:border-color 0.15s}
input:focus{border-color:#D85A30}
.row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.row input{flex:1;margin-bottom:0}
button{padding:10px 18px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.12s;white-space:nowrap}
button:hover{background:#f5f4f0;border-color:#bbb}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-primary{background:#D85A30;color:#fff;border-color:#D85A30;font-size:15px}
.btn-primary:hover{background:#c04f28;border-color:#c04f28}
.room-code{font-size:32px;font-weight:700;letter-spacing:0.2em;color:#1a1a1a;text-align:center;padding:0.5rem 0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.tag-host{background:#E1F5EE;color:#085041}
.tag-player{background:#E6F1FB;color:#0C447C}
.section-label{font-size:12px;font-weight:600;color:#888;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px}
.player-chip{display:inline-flex;align-items:center;gap:6px;background:#f5f4f0;border:1px solid #e5e3de;border-radius:99px;padding:5px 12px;font-size:13px;margin:3px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#639922;display:inline-block}
#the-btn{width:100%;padding:2.5rem;border-radius:14px;background:#D85A30;border:none;color:#fff;font-size:32px;font-weight:700;cursor:pointer;transition:transform 0.07s,background 0.1s;user-select:none;letter-spacing:-0.01em}
#the-btn:active{transform:scale(0.96)}
#the-btn:disabled{background:#ccc;cursor:not-allowed}
.countdown-num{font-size:80px;font-weight:700;text-align:center;color:#D85A30;line-height:1;padding:1.5rem 0}
.result-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0eeea;font-size:15px}
.result-row:last-child{border-bottom:none}
.medal{font-size:22px;width:28px;text-align:center}
.result-name{flex:1;font-weight:600;color:#1a1a1a}
.result-ms{color:#888;font-size:13px}
.result-win{background:#E1F5EE;color:#085041;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.err{font-size:12px;color:#c04f28;min-height:16px;margin-top:4px}
.status-text{text-align:center;font-size:14px;color:#888;min-height:20px;margin-top:8px}
.hidden{display:none}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#639922;display:inline-block;margin-right:6px}
.conn-dot.off{background:#E24B4A}
</style>
</head>
<body>
<div id="app">
  <h1>⚡ 按鈕競速</h1>

  <div id="s-join">
    <div class="card">
      <div style="margin-bottom:14px">
        <label>你的名字</label>
        <input id="inp-name" placeholder="輸入名字..." maxlength="16" autocomplete="off"/>
      </div>
      <div>
        <label>房間代碼（留空 = 建立新房間）</label>
        <div class="row">
          <input id="inp-room" placeholder="XXXX" maxlength="8" autocomplete="off" oninput="this.value=this.value.toUpperCase()"/>
          <button class="btn-primary" onclick="doJoin()">加入 / 建立</button>
        </div>
      </div>
      <div class="err" id="join-err"></div>
    </div>
  </div>

  <div id="s-lobby" class="hidden">
    <div class="card">
      <div class="header-row">
        <div>
          <div class="section-label">房間代碼</div>
          <div class="room-code" id="lbl-code">----</div>
        </div>
        <span id="lbl-tag" class="tag"></span>
      </div>
      <div class="section-label">玩家列表</div>
      <div id="player-list" style="margin-bottom:16px;min-height:36px"></div>
      <div id="host-ctrl" class="hidden">
        <button class="btn-primary" id="btn-start" onclick="sendStart()" style="width:100%" disabled>開始遊戲</button>
        <div class="status-text">至少 2 人才能開始</div>
      </div>
      <div id="guest-wait" class="hidden status-text">等待房主開始遊戲...</div>
    </div>
  </div>

  <div id="s-countdown" class="hidden">
    <div class="card" style="text-align:center">
      <div class="section-label" style="text-align:center">準備好了嗎？</div>
      <div class="countdown-num" id="cd-num">3</div>
      <div class="status-text">手放在按鈕上！</div>
    </div>
  </div>

  <div id="s-game" class="hidden">
    <div class="card" style="margin-bottom:12px">
      <div class="status-text" id="game-status" style="margin-bottom:16px;font-size:16px;color:#1a1a1a;font-weight:500">等待開始...</div>
      <button id="the-btn" disabled onclick="pressButton()">按我！</button>
      <div class="status-text" id="my-result"></div>
    </div>
    <div class="card hidden" id="result-card">
      <div class="section-label">結果排行</div>
      <div id="result-list"></div>
      <div id="host-restart" class="hidden" style="margin-top:16px">
        <button onclick="sendRestart()" style="width:100%">再玩一次</button>
      </div>
    </div>
  </div>
</div>

<script>
let ws, myName='', myRoom='', amHost=false, pressed=false, gameStartTs=null;

function show(id){ ['s-join','s-lobby','s-countdown','s-game'].forEach(s=>document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

function uid(n=4){ return Math.random().toString(36).slice(2,2+n).toUpperCase(); }

function doJoin(){
  const name=document.getElementById('inp-name').value.trim();
  const room=document.getElementById('inp-room').value.trim().toUpperCase();
  const err=document.getElementById('join-err');
  if(!name){err.textContent='請輸入名字';return;}
  myName=name;
  myRoom=room||uid();
  document.getElementById('inp-room').value=myRoom;
  connect();
}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>{ ws.send(JSON.stringify({type:'join',name:myName,room:myRoom})); };
  ws.onmessage=e=>{ try{handle(JSON.parse(e.data));}catch(ex){} };
  ws.onclose=()=>{ document.getElementById('join-err').textContent='連線中斷，請重新整理'; };
}

function handle(msg){
  if(msg.type==='error'){ document.getElementById('join-err').textContent=msg.msg; return; }

  if(msg.type==='state'){
    myRoom=msg.room; amHost=msg.host===myName;
    document.getElementById('lbl-code').textContent=myRoom;
    document.getElementById('lbl-tag').textContent=amHost?'房主':'玩家';
    document.getElementById('lbl-tag').className='tag '+(amHost?'tag-host':'tag-player');
    renderPlayers(msg.players, msg.host);
    if(amHost){ document.getElementById('host-ctrl').classList.remove('hidden'); document.getElementById('btn-start').disabled=msg.players.length<2; }
    else { document.getElementById('guest-wait').classList.remove('hidden'); }
    if(msg.phase==='lobby') show('s-lobby');
    if(msg.phase==='done'){ show('s-game'); renderResults(msg.results); }
  }

  if(msg.type==='countdown'){ show('s-countdown'); startCountdown(); }
  if(msg.type==='tick'){ document.getElementById('cd-num').textContent=msg.n; }
  if(msg.type==='go'){
    gameStartTs=msg.startTs; pressed=false;
    show('s-game');
    document.getElementById('game-status').textContent='快按！';
    const btn=document.getElementById('the-btn');
    btn.disabled=false; btn.textContent='按我！';
    document.getElementById('my-result').textContent='';
    document.getElementById('result-card').classList.add('hidden');
    document.getElementById('result-list').innerHTML='';
    if(amHost) document.getElementById('host-restart').classList.add('hidden');
  }
  if(msg.type==='pressed'){ updateResults(msg.results); }
  if(msg.type==='done'){ renderResults(msg.results); }
}

function startCountdown(){
  let n=3; document.getElementById('cd-num').textContent=n;
}

function pressButton(){
  if(pressed) return;
  pressed=true;
  const ms=Date.now()-(gameStartTs||Date.now());
  document.getElementById('the-btn').disabled=true;
  document.getElementById('the-btn').textContent='✓ 已按下';
  document.getElementById('my-result').textContent='你的反應：'+ms+' ms';
  ws.send(JSON.stringify({type:'press'}));
}

function sendStart(){ ws.send(JSON.stringify({type:'start'})); }
function sendRestart(){ ws.send(JSON.stringify({type:'restart'})); }

function renderPlayers(players, host){
  document.getElementById('player-list').innerHTML=players.map(p=>`<span class="player-chip"><span class="dot"></span>${p}${p===host?' 👑':''}</span>`).join('');
}

function updateResults(results){
  document.getElementById('result-card').classList.remove('hidden');
  const sorted=Object.entries(results).sort((a,b)=>a[1]-b[1]);
  const medals=['🥇','🥈','🥉'];
  document.getElementById('result-list').innerHTML=sorted.map(([n,ms],i)=>`<div class="result-row"><span class="medal">${medals[i]||'·'}</span><span class="result-name">${n}${n===myName?' (你)':''}</span><span class="result-ms">${ms} ms</span></div>`).join('');
}

function renderResults(results){
  if(!results||Object.keys(results).length===0) return;
  document.getElementById('result-card').classList.remove('hidden');
  document.getElementById('game-status').textContent='遊戲結束！';
  const sorted=Object.entries(results).sort((a,b)=>a[1]-b[1]);
  const medals=['🥇','🥈','🥉'];
  document.getElementById('result-list').innerHTML=sorted.map(([n,ms],i)=>`<div class="result-row"><span class="medal">${medals[i]||'·'}</span><span class="result-name">${n}${n===myName?' (你)':''}</span><span class="result-ms">${ms} ms</span>${i===0?'<span class="result-win">最快！</span>':''}</div>`).join('');
  if(amHost) document.getElementById('host-restart').classList.remove('hidden');
}
</script>
</body>
</html>
